# Cosmos3-Edge action-policy SFT for one merged, 10 FPS, 40-task LIBERO
# LeRobot v3 dataset. Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH,
# IMAGINAIRE_OUTPUT_ROOT. See docs/action_policy_libero_posttrain.md.

[job]
task       = "vfm"
experiment = "action_policy_libero_all_edge_10fps"
project    = "cosmos3_action_libero"
group      = "action_sft"
name       = "action_policy_libero_all_edge_10fps"
wandb_mode = "offline"

[model]
precision                    = "bfloat16"
max_num_tokens_after_packing = 45056

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [500]

[trainer]
max_iter        = 5000
logging_iter    = 50
grad_accum_iter = 2 # global batch = 128 samples/rank x 8 ranks x 2 = 2048

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 2000
